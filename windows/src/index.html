<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://images.ygoprodeck.com; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Deck Lab</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span><span>DECK LAB</span>
      </div>
      <p class="edition">DESKTOP / 0.2</p>
      <nav id="navigation"></nav>
      <div class="rail-note">
        <span class="local-dot"></span> Local workspace<br /><small
          >Your collection stays with you.</small
        >
      </div>
    </aside>
    <main>
      <header>
        <div>
          <p class="eyebrow">WORKSPACE <span>/</span> DECK LAB</p>
          <h1 id="title">Explore decks</h1>
        </div>
        <div class="header-actions">
          <button id="quick-search" aria-label="Find a card (Control K)">
            Find a card <kbd>Ctrl K</kbd></button
          ><button id="theme-toggle" aria-label="Switch to light mode">
            Light mode
          </button>
        </div>
      </header>
      <div id="status" role="status" aria-live="polite">
        Opening local workspace…
      </div>
      <section id="content"></section>
    </main>
    <dialog id="card-dialog">
      <button id="close-dialog" class="close" aria-label="Close card preview">
        ×
      </button>
      <div id="card-detail"></div>
    </dialog>
    <script src="renderer.js"></script>
  </body>
</html>
